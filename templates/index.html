<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Information AI Agent</title>
    <style>
      :root {
        --bg: #f5f1e8;
        --panel: #fffdf8;
        --ink: #1e1f1a;
        --muted: #6b6d63;
        --accent: #1f6f5f;
        --accent-strong: #0d4e42;
        --line: #d8d0c2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(31, 111, 95, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(183, 120, 57, 0.18), transparent 26%),
          var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .app {
        width: min(880px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(34, 30, 22, 0.09);
        overflow: hidden;
      }

      .hero {
        padding: 28px 28px 18px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(135deg, rgba(31, 111, 95, 0.08), rgba(255, 255, 255, 0));
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 10px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(32px, 5vw, 48px);
        line-height: 1;
      }

      .subcopy {
        margin: 0;
        max-width: 60ch;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .workspace {
        padding: 24px;
      }

      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .chip {
        border: 1px solid var(--line);
        background: #fbf7ee;
        color: var(--ink);
        border-radius: 999px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 14px;
      }

      .chip:hover {
        border-color: var(--accent);
        color: var(--accent-strong);
      }

      form {
        display: grid;
        gap: 12px;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        border-radius: 16px;
        border: 1px solid var(--line);
        padding: 16px;
        font: inherit;
        font-size: 16px;
        background: #fff;
      }

      textarea:focus {
        outline: 2px solid rgba(31, 111, 95, 0.25);
        border-color: var(--accent);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        padding: 12px 18px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-strong);
      }

      .status {
        color: var(--muted);
        font-size: 14px;
      }

      .result {
        margin-top: 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        background: #fffdfa;
      }

      .result.hidden {
        display: none;
      }

      .result h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      .answer {
        margin: 0 0 12px;
        font-size: 18px;
        line-height: 1.6;
      }

      .meta {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      .error {
        color: #a22727;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <p class="eyebrow">LangGraph + FastAPI</p>
        <h1>Country Information AI Agent</h1>
        <p class="subcopy">
          Ask about country capital, population, currency, languages, region, and subregion.
          Answers are grounded in the public REST Countries API.
        </p>
      </section>

      <section class="workspace">
        <div class="examples">
          <button class="chip" type="button" data-question="What is the population of Germany?">Germany population</button>
          <button class="chip" type="button" data-question="What currency does Japan use?">Japan currency</button>
          <button class="chip" type="button" data-question="What is the capital and population of Brazil?">Brazil capital + population</button>
          <button class="chip" type="button" data-question="What languages are spoken in India?">India languages</button>
        </div>

        <form id="ask-form">
          <textarea id="question" placeholder="Ask a question about a country..."></textarea>
          <div class="actions">
            <button type="submit">Ask</button>
            <span id="status" class="status">Ready</span>
          </div>
        </form>

        <section id="result" class="result hidden">
          <h2>Response</h2>
          <p id="answer" class="answer"></p>
          <div class="meta">
            <div><strong>Country:</strong> <span id="country">-</span></div>
            <div><strong>Requested fields:</strong> <span id="fields">-</span></div>
            <div><strong>Grounded:</strong> <span id="grounded">-</span></div>
            <div><strong>Source:</strong> <span id="source">-</span></div>
            <div id="error-row" class="error hidden"><strong>Error:</strong> <span id="error-message"></span></div>
          </div>
        </section>
      </section>
    </main>

    <script>
      const form = document.getElementById("ask-form");
      const questionInput = document.getElementById("question");
      const statusEl = document.getElementById("status");
      const resultEl = document.getElementById("result");
      const answerEl = document.getElementById("answer");
      const countryEl = document.getElementById("country");
      const fieldsEl = document.getElementById("fields");
      const groundedEl = document.getElementById("grounded");
      const sourceEl = document.getElementById("source");
      const errorRowEl = document.getElementById("error-row");
      const errorMessageEl = document.getElementById("error-message");

      for (const chip of document.querySelectorAll(".chip")) {
        chip.addEventListener("click", () => {
          questionInput.value = chip.dataset.question || "";
          questionInput.focus();
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const question = questionInput.value.trim();
        if (!question) {
          statusEl.textContent = "Question is required.";
          return;
        }

        statusEl.textContent = "Fetching country data...";

        try {
          const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });

          const payload = await response.json();

          resultEl.classList.remove("hidden");
          answerEl.textContent = payload.answer || "";
          countryEl.textContent = payload.country || "-";
          fieldsEl.textContent = (payload.requested_fields || []).join(", ") || "-";
          groundedEl.textContent = String(payload.grounded);
          sourceEl.textContent = payload.source || "-";

          if (payload.error) {
            errorRowEl.classList.remove("hidden");
            errorMessageEl.textContent = `${payload.error.code}: ${payload.error.message}`;
          } else {
            errorRowEl.classList.add("hidden");
            errorMessageEl.textContent = "";
          }

          statusEl.textContent = response.ok ? "Done" : "Request failed";
        } catch (error) {
          resultEl.classList.remove("hidden");
          answerEl.textContent = "Request failed.";
          countryEl.textContent = "-";
          fieldsEl.textContent = "-";
          groundedEl.textContent = "false";
          sourceEl.textContent = "-";
          errorRowEl.classList.remove("hidden");
          errorMessageEl.textContent = error.message;
          statusEl.textContent = "Network error";
        }
      });
    </script>
  </body>
</html>
